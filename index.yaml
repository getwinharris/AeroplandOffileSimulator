rules:
  - "Concepts point to original sources; this index never duplicates source bodies."
  - "Read discovery first; query only the relevant section. Do not load this entire index into agent context."
  - "Use at most three discovery hops: entry instructions, exact index match, original source."
discovery:
  - question: "Does a screen, view, model or game system exist?"
    use: "docs/project-index.json"
  - question: "How are screens, views, models and game systems connected?"
    use: "docs/systematic-map.mmd"
  - question: "Where is the mouse/SHIFT steering code?"
    use: "concepts filtered by type=view, then read its resource"
  - question: "Which plane style builds which wings / speed?"
    use: "concepts filtered by type=plane, then read its resource"
  - question: "What repo instructions or skill apply?"
    use: "CLAUDE.md, AGENTS.md, then .claude/skills"
  - question: "How do I build the installer or debug a crash?"
    use: "docs/observability.md + ./aero logs"
query_examples:
  - "sed -n '1,40p' index.yaml"
  - "rg -n -B2 -A8 'id: 'screen:fly'' index.yaml"
  - "rg -n -A6 'type: 'plane'' index.yaml"
  - "rg -n '<term>' docs/project-index.json map.mmd index.yaml"
